services:
  nasa-earth-jukebox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nasa_earth_jukebox
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount cache directory to persist downloaded NASA satellite telemetry across container restarts
      - ./backend/cache:/app/backend/cache
    restart: unless-stopped
